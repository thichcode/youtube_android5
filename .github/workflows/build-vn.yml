name: Build PipePipe VN

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for patches)
        uses: actions/checkout@v3

      - name: Clone PipePipe
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git clone --depth 1 --branch v4.9.2 https://github.com/InfinityLoop1308/PipePipe.git pipepipe
          cd pipepipe && git submodule update --init --depth 1

      - name: Apply VisionOS extractor backport
        run: |
          git -C pipepipe/PipePipeExtractor apply $GITHUB_WORKSPACE/pipepipe-vn/patches/visionos-backport.patch
          git -C pipepipe/PipePipeExtractor diff --stat

      - name: Apply Music kiosk patches
        run: |
          git -C pipepipe/PipePipeExtractor apply $GITHUB_WORKSPACE/pipepipe-vn/patches/music-kiosk.patch
          git -C pipepipe/PipePipeClient apply $GITHUB_WORKSPACE/pipepipe-vn/patches/music-kiosk-client.patch
          git -C pipepipe/PipePipeExtractor diff --stat

      - name: Patch app name and version
        working-directory: pipepipe/PipePipeClient
        run: |
          sed -i 's/resValue "string", "app_name", "PipePipe"/resValue "string", "app_name", "PipePipe VN"/' app/build.gradle
          sed -i 's/versionCode 1097/versionCode 1098/' app/build.gradle

      - name: Patch default country to VN
        working-directory: pipepipe/PipePipeClient
        run: |
          sed -i 's/android:defaultValue="@string\/default_localization_key"/android:defaultValue="VN"/3' app/src/main/res/xml/content_settings.xml

      - name: Add resolver URL setting
        working-directory: pipepipe/PipePipeClient
        run: |
          sed -i '/<\/PreferenceScreen>/i\    <EditTextPreference\n        android:defaultValue="https://shortvideo-resolver.onrender.com"\n        android:key="resolver_url_key"\n        android:title="Video Resolver URL"\n        android:summary="URL of the video resolver API"\n        app:singleLineTitle="false"\n        app:iconSpaceReserved="false" />\n' app/src/main/res/xml/content_settings.xml

      - name: Add resolver strings
        working-directory: pipepipe/PipePipeClient
        run: |
          sed -i '/<\/resources>/i\<string name="resolver_url_key">resolver_url_key</string>\n<string name="resolver_url_title">Video Resolver URL</string>\n<string name="resolver_url_summary">URL of the video resolver API (e.g. https://shortvideo-resolver.onrender.com)</string>' app/src/main/res/values/strings.xml

      - name: Add gradle JVM args
        working-directory: pipepipe/PipePipeClient
        run: echo "org.gradle.jvmargs=-Xmx4g" >> gradle.properties

      - name: Set up JDK 17 for SDK setup
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-33"

      - name: Set up JDK 11 for build
        uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: "temurin"
          cache: 'gradle'

      - name: Build release APK
        working-directory: pipepipe/PipePipeClient
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign APKs
        run: |
          # Generate debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          # Sign each APK
          for apk in pipepipe/PipePipeClient/app/build/outputs/apk/release/*-release-unsigned.apk; do
            signed="${apk/-unsigned.apk/.apk}"
            cp "$apk" "$signed"
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out "$signed" "$apk"
          done
          # Collect signed APKs
          mkdir -p release-apks
          cp pipepipe/PipePipeClient/app/build/outputs/apk/release/*-release.apk release-apks/ || true
          ls -la release-apks/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v4.9.2-vn
          name: PipePipe VN v4.9.2-vn
          files: release-apks/*.apk
          generate_release_notes: true
