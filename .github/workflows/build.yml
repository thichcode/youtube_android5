name: Build and Release TizenTube Lite

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 || echo "wrapper generation skipped"
          fi
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace || gradle :app:assembleDebug --stacktrace

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace || gradle :app:assembleRelease --stacktrace

      - name: Verify APK (aapt)
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk || true
          ls -lh app/build/outputs/apk/release/*.apk || true
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "sdkVersion|package" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tizentube-lite-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: tizentube-lite-release
          path: app/build/outputs/apk/release/app-release-*.apk
          if-no-files-found: warn

      - name: Get version
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | sed "s/.*\"\(.*\)\".*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TizenTube Lite ${{ steps.version.outputs.version }}
          body: |
            ## TizenTube Lite ${{ steps.version.outputs.version }}
            - Android 5.0+ (API 21), armeabi-v7a only, ~7-9MB
            - Ad-block only (no SponsorBlock/DeArrow)
            - WebView wrapper for low RAM boxes (1GB)
            - Install: `adb install tizentube-lite-release.apk`
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Auto-tag on push to master: create dated tag if version changed
  auto-tag:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Auto tag
        run: |
          VERSION=$(grep versionName app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Pushed tag $TAG"
          fi
