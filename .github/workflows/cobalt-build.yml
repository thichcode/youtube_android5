name: Cobalt Android 5 Build (API 21)

on:
  push:
    branches: [cobalt]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cobalt branch
        uses: actions/checkout@v4
        with:
          ref: cobalt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          set -x
          curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o apktool.jar
          chmod +x apktool
          ls -lh apktool* || true
          java -jar apktool.jar --version || java -jar apktool.jar version || true

      - name: Download latest TizenTubeCobalt APK
        run: |
          LATEST=$(curl -s https://api.github.com/repos/reisxd/TizenTubeCobalt/releases/latest | grep browser_download_url | grep -i "\.apk" | head -1 | cut -d '"' -f 4)
          echo "Latest APK: $LATEST"
          if [ -z "$LATEST" ]; then
            # fallback: list releases
            curl -s https://api.github.com/repos/reisxd/TizenTubeCobalt/releases | grep browser_download_url | head -5
            exit 1
          fi
          wget -q "$LATEST" -O cobalt-original.apk
          ls -lh cobalt-original.apk
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging cobalt-original.apk | grep -E "sdkVersion|package" || true

      - name: Patch minSdk 24 -> 21 (binary + apktool fallback)
        run: |
          set -x
          # Try 1: binary patch AndroidManifest.xml directly (no decode, keeps native libs intact)
          python3 - << 'PY' || echo "python patch failed"
          import zipfile, re, os
          apk_in = "cobalt-original.apk"
          apk_out = "cobalt-patched-unsigned.apk"
          # fallback: try apktool if python fails
          try:
              import struct
              with zipfile.ZipFile(apk_in, 'r') as zin:
                  manifest = zin.read('AndroidManifest.xml')
                  # Binary XML: search for minSdk integer 24 (0x18) in manifest
                  # Simple replace: 24 -> 21 in binary (little endian)
                  # minSdk is stored as integer attribute
                  patched = manifest.replace(b'\x18\x00\x00\x00', b'\x15\x00\x00\x00', 1)
                  if patched != manifest:
                      print("binary patch: 24 -> 21 done")
                  else:
                      print("binary patch: pattern not found, will use apktool")
                      raise Exception("no patch")
                  with zipfile.ZipFile(apk_out, 'w', compression=zipfile.ZIP_STORED) as zout:
                      for item in zin.infolist():
                          data = patched if item.filename == 'AndroidManifest.xml' else zin.read(item.filename)
                          zout.writestr(item, data)
              print("binary patch success")
          except Exception as e:
              print(f"binary patch failed: {e}")
              if os.path.exists(apk_out):
                  os.remove(apk_out)
          PY
          if [ -f cobalt-patched-unsigned.apk ]; then
            echo "binary patch OK"
            ls -lh cobalt-patched*.apk
          else
            echo "fallback to apktool with aapt2"
            rm -rf cobalt-decoded
            java -jar apktool.jar d cobalt-original.apk -o cobalt-decoded --no-src 2>&1 | head -50
            sed -i -E 's/minSdkVersion: .*/minSdkVersion: 21/' cobalt-decoded/apktool.yml || true
            sed -i -E "s/minSdkVersion: '.*'/minSdkVersion: '21'/" cobalt-decoded/apktool.yml || true
            if [ -f cobalt-decoded/AndroidManifest.xml ]; then
              sed -i -E 's/android:minSdkVersion="[0-9]+"/android:minSdkVersion="21"/' cobalt-decoded/AndroidManifest.xml || true
            fi
            java -jar apktool.jar b cobalt-decoded -o cobalt-patched-unsigned.apk --use-aapt2 2>&1 | tail -30
            ls -lh cobalt-patched*.apk
          fi

      - name: Sign APK (debug keystore)
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out TizenTubeCobalt-v1.0.1-cobalt-android5.apk cobalt-patched-unsigned.apk || \
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore debug.keystore -storepass android cobalt-patched-unsigned.apk androiddebugkey && cp cobalt-patched-unsigned.apk TizenTubeCobalt-v1.0.1-cobalt-android5.apk
          ls -lh TizenTube*.apk
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging TizenTubeCobalt-v1.0.1-cobalt-android5.apk | grep -E "sdkVersion|package" || true

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android5-patched
          path: TizenTubeCobalt-*.apk

      - name: Create Release (on tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: TizenTubeCobalt-*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
