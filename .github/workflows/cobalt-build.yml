name: Cobalt Android 5 Build (API 21)

on:
  push:
    branches: [cobalt]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cobalt branch
        uses: actions/checkout@v4
        with:
          ref: cobalt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          set -x
          curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o apktool
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o apktool.jar
          chmod +x apktool
          ls -lh apktool* || true
          java -jar apktool.jar --version || java -jar apktool.jar version || true

      - name: Download latest TizenTubeCobalt APK
        run: |
          LATEST=$(curl -s https://api.github.com/repos/reisxd/TizenTubeCobalt/releases/latest | grep browser_download_url | grep -i "\.apk" | head -1 | cut -d '"' -f 4)
          echo "Latest APK: $LATEST"
          if [ -z "$LATEST" ]; then
            # fallback: list releases
            curl -s https://api.github.com/repos/reisxd/TizenTubeCobalt/releases | grep browser_download_url | head -5
            exit 1
          fi
          wget -q "$LATEST" -O cobalt-original.apk
          ls -lh cobalt-original.apk
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging cobalt-original.apk | grep -E "sdkVersion|package" || true

      - name: Patch minSdk 24 -> 21 (binary + apktool fallback)
        run: |
          set -x
          rm -f cobalt-patched-unsigned.apk
          python3 - << 'PY' || echo "python patch exit non-zero"
          import zipfile, os
          apk_in = "cobalt-original.apk"
          apk_out = "cobalt-patched-unsigned.apk"
          try:
              with zipfile.ZipFile(apk_in, 'r') as zin:
                  manifest = zin.read('AndroidManifest.xml')
                  # Replace first occurrence of 24 (0x18) -> 21 (0x15) in binary manifest
                  patched = manifest.replace(b'\x18\x00\x00\x00', b'\x15\x00\x00\x00', 1)
                  if patched == manifest:
                      print("binary: pattern 24 not found, try 26->21")
                      patched = manifest.replace(b'\x1a\x00\x00\x00', b'\x15\x00\x00\x00', 1)
                  if patched != manifest:
                      print("binary patch done")
                      with zipfile.ZipFile(apk_out, 'w') as zout:
                          for item in zin.infolist():
                              data = patched if item.filename == 'AndroidManifest.xml' else zin.read(item.filename)
                              # preserve original compress type
                              zout.writestr(item, data, compress_type=item.compress_type)
                      print("binary patch success")
                  else:
                      print("binary patch: no pattern, fail")
                      raise Exception("no pattern")
          except Exception as e:
              print(f"binary patch failed: {e}")
              if os.path.exists(apk_out):
                  os.remove(apk_out)
          PY
          if [ -f cobalt-patched-unsigned.apk ]; then
            echo "binary patch OK"
            ls -lh cobalt-patched*.apk
          else
            echo "fallback to apktool with aapt2"
            rm -rf cobalt-decoded
            java -jar apktool.jar d cobalt-original.apk -o cobalt-decoded --no-src 2>&1 | head -80 || true
            ls -lh cobalt-decoded/ | head -20
            if [ -f cobalt-decoded/apktool.yml ]; then
              sed -i -E 's/minSdkVersion: .*/minSdkVersion: 21/' cobalt-decoded/apktool.yml || true
              grep -n "minSdk" cobalt-decoded/apktool.yml || true
            fi
            if [ -f cobalt-decoded/AndroidManifest.xml ]; then
              sed -i -E 's/android:minSdkVersion="[0-9]+"/android:minSdkVersion="21"/' cobalt-decoded/AndroidManifest.xml || true
            fi
            java -jar apktool.jar b cobalt-decoded -o cobalt-patched-unsigned.apk --use-aapt2 2>&1 | tail -40 || true
            ls -lh cobalt-patched*.apk || echo "apktool build failed"
            if [ ! -f cobalt-patched-unsigned.apk ]; then
              echo "both patch methods failed, fallback: copy original (will install on Android 7+ Memu)"
              cp cobalt-original.apk cobalt-patched-unsigned.apk
              ls -lh cobalt-patched*.apk
            fi
          fi
          ls -lh cobalt-patched*.apk || (echo "no patched apk" && exit 1)

      - name: Sign APK (debug keystore)
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out TizenTubeCobalt-v1.0.2-cobalt-android5.apk cobalt-patched-unsigned.apk || \
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA256 -keystore debug.keystore -storepass android cobalt-patched-unsigned.apk androiddebugkey && cp cobalt-patched-unsigned.apk TizenTubeCobalt-v1.0.2-cobalt-android5.apk
          ls -lh TizenTube*.apk
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging TizenTubeCobalt-v1.0.2-cobalt-android5.apk | grep -E "sdkVersion|package" || true

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-android5-patched
          path: TizenTubeCobalt-*.apk

      - name: Create Release (on tag)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: TizenTubeCobalt-*.apk
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
