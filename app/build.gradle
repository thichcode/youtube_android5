plugins {
    id 'com.android.application'
}

def loadSigning = {
    def kf = rootProject.file('app/keystore.properties')
    if (kf.exists()) {
        def ks = new Properties()
        kf.withInputStream { ks.load(it) }
        return [file: rootProject.file("app/${ks.storeFile}"), pass: ks.storePassword,
                alias: ks.keyAlias, keypass: ks.keyPassword]
    }
    def envPass = System.getenv('KEYSTORE_PASSWORD')
    if (envPass != null) {
        def cf = rootProject.file('app/ci-release.jks')
        if (cf.exists()) {
            return [file: cf, pass: envPass, alias: System.getenv('KEY_ALIAS'), keypass: System.getenv('KEY_PASSWORD')]
        }
    }
    null
}
def signing = loadSigning()

android {
    namespace 'io.gh.yourname.tizentubelite'
    compileSdk 34
    defaultConfig {
        applicationId "io.gh.yourname.tizentubelite"
        minSdk 21
        targetSdk 34
versionCode 21
    versionName "2.0.1-native"
        ndk { abiFilters "armeabi-v7a" }
    }
    signingConfigs {
        release {
            if (signing != null) {
                storeFile signing.file
                storePassword signing.pass
                keyAlias signing.alias
                keyPassword signing.keypass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signing != null) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = false
    }
    // APK filename = TizenTubeLite-v{versionName}.apk (matches git tag v1.0.18-webview95)
    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildType = variant.buildType.name
            def ver = variant.versionName
            // e.g. TizenTubeLite-v1.0.2-lite-debug.apk / TizenTubeLite-v1.0.2-lite-release.apk
            outputFileName = "TizenTubeLite-v${ver}-${buildType}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.18.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20210307'
}
