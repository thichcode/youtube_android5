plugins {
    id 'com.android.application'
}

def loadSigning = {
    def kf = rootProject.file('app/keystore.properties')
    if (kf.exists()) {
        def ks = new Properties()
        kf.withInputStream { ks.load(it) }
        return [file: rootProject.file("app/${ks.storeFile}"), pass: ks.storePassword,
                alias: ks.keyAlias, keypass: ks.keyPassword]
    }
    def envPass = System.getenv('KEYSTORE_PASSWORD')
    if (envPass != null) {
        def cf = rootProject.file('app/ci-release.jks')
        if (cf.exists()) {
            return [file: cf, pass: envPass, alias: System.getenv('KEY_ALIAS'), keypass: System.getenv('KEY_PASSWORD')]
        }
    }
    null
}
def signing = loadSigning()

android {
    namespace 'io.gh.yourname.tizentubelite'
    compileSdk 34
    defaultConfig {
        applicationId "io.gh.yourname.tizentubelite"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.0.3"
        ndk { abiFilters "armeabi-v7a" }
    }
    signingConfigs {
        release {
            if (signing != null) {
                storeFile signing.file
                storePassword signing.pass
                keyAlias signing.alias
                keyPassword signing.keypass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signing != null) signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildType = variant.buildType.name
            def ver = variant.versionName
            outputFileName = "TizenTubeLite-v${ver}-${buildType}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.6.1'
}
