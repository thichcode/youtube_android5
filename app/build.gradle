plugins {
    id 'com.android.application'
}

android {
    namespace 'io.gh.yourname.tizentubelite'
    compileSdk 34
    defaultConfig {
        applicationId "io.gh.yourname.tizentubelite"
        minSdk 21
        targetSdk 34
        versionCode 14
        versionName "1.0.13-tvm118"
        ndk { abiFilters "armeabi-v7a" }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // APK filename = TizenTubeLite-v{versionName}.apk (matches git tag v1.0.13-tvm118)
    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildType = variant.buildType.name
            def ver = variant.versionName
            // e.g. TizenTubeLite-v1.0.2-lite-debug.apk / TizenTubeLite-v1.0.2-lite-release.apk
            outputFileName = "TizenTubeLite-v${ver}-${buildType}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.6.1'
}
