plugins {
    id 'com.android.application'
}

android {
    namespace 'io.gh.yourname.tizentubelite'
    compileSdk 34
    defaultConfig {
        applicationId "io.gh.yourname.tizentubelite"
        minSdk 21
        targetSdk 34
        versionCode 19
        versionName "1.0.18-webview95"
        ndk { abiFilters "armeabi-v7a" }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = false
    }
    // APK filename = TizenTubeLite-v{versionName}.apk (matches git tag v1.0.18-webview95)
    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildType = variant.buildType.name
            def ver = variant.versionName
            // e.g. TizenTubeLite-v1.0.2-lite-debug.apk / TizenTubeLite-v1.0.2-lite-release.apk
            outputFileName = "TizenTubeLite-v${ver}-${buildType}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.18.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20210307'
}
