name: Build PipePipe VN

on:
  push:
    tags:
      - 'v*-vn'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: "temurin"
          cache: 'gradle'

      - name: Build release APK
        run: |
          cd PipePipeClient
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp PipePipeClient/app/build/outputs/apk/release/*.apk release-apks/ || true
          ls -la release-apks/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
